# =============================================================================
# Citera 溯源知识库 · CI
#
# 三个 job：
#   backend      —— PostgreSQL 16 + pgvector service 上跑迁移 + 种子 + pytest（契约 §8.1）
#   frontend     —— pnpm install / build / vitest（契约 §8.2）
#   integration  —— 真的把镜像 build 起来、compose 起服务、打 HTTP 做一次完整问答（契约 §8.3）
#
# 注意：GitHub Actions 只识别仓库根的 .github/workflows/，不是 deploy/.github/。
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"
  BASE_URL: http://localhost:8000

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: backend · pytest (pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citera
          POSTGRES_PASSWORD: citera
          POSTGRES_DB: citera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citera -d citera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENV: test
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://citera:citera@localhost:5432/citera
      TEST_DATABASE_URL: postgresql+psycopg://citera:citera@localhost:5432/citera
      JWT_SECRET: ci-only-secret-please-change-0123456789abcdef
      ACCESS_TOKEN_EXPIRE_MINUTES: "720"
      SERVE_FRONTEND: "false"
      SEED_DEMO_DATA: "true"
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIM: "384"
      LLM_PROVIDER: echo
      RETRIEVAL_MODE: hybrid
      RATE_LIMIT_ENABLED: "false"
      MAX_UPLOAD_MB: "10"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -e .
          fi
          pip install pytest pytest-cov

      - name: alembic upgrade head（空库一次成功，契约 §8.1）
        run: alembic upgrade head

      - name: pytest（契约 §8.1：全绿、用例数 ≥70）
        run: python -m pytest -q --maxfail=1

      - name: init_db 幂等性（连跑两次结果一致，契约 §8.1）
        run: |
          python -m app.db.init_db
          python -m app.db.init_db

  # ---------------------------------------------------------------------------
  frontend:
    name: frontend · build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Type check + build（契约 §8.2：产物 dist/）
        run: pnpm run build

      - name: vitest（契约 §8.2：全绿）
        run: npx vitest run

      - name: 上传 dist 供 integration job 校验
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  integration:
    name: integration · docker compose 端到端
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up --build（单容器 + pgvector）
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: 等 /api/health 就绪（冷启动 < 60s 目标，契约 §8.3）
        run: |
          start=$(date +%s)
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/api/health" | grep -q '"status"'; then
              echo "健康检查通过，用时 $(( $(date +%s) - start ))s"
              curl -fsS "$BASE_URL/api/health"; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::60 次探测后 /api/health 仍未就绪"
          docker compose -f deploy/docker-compose.yml logs --no-color --tail 200
          exit 1

      - name: SPA 首页由同一端口托管
        run: |
          curl -fsS "$BASE_URL/" -o /tmp/index.html
          grep -qi '<div id="app"' /tmp/index.html || { echo "::error::首页不是 SPA 入口"; head -40 /tmp/index.html; exit 1; }
          echo "SPA 首页 OK（$(wc -c < /tmp/index.html) bytes）"

      - name: 完整问答（登录 → 建会话 → 提问 → 校验引用，契约 §8.3）
        run: python3 deploy/scripts/smoke_api.py --base-url "$BASE_URL"

      - name: 容器日志（失败也要看得到）
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail 300

      - name: 清理
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
