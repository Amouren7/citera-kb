[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# NOTE: keep this file ASCII-only. Alembic reads alembic.ini with
# configparser using the locale encoding on Windows (GBK here), so any
# non-ASCII byte in this file raises UnicodeDecodeError before migrations run.
# The real connection string is injected by alembic/env.py from
# app.core.config.settings, so no credentials live in version control.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
